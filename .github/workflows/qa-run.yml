name: qa-live-check
on:
  push:
    branches: [qa-run]
    paths: [qa/shoot.js, .github/workflows/qa-run.yml]
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node qa/shoot.js
      - name: Save screenshots to this branch
        if: always()
        run: |
          git config user.name qa-bot; git config user.email qa-bot@users.noreply.github.com
          git add qa/out && git commit -q -m "qa screenshots" && git push -q origin HEAD:qa-run || true
