name: strategies
on:
  schedule:
    - cron: "30 13 * * 1-5"      # 19:00 IST: refresh each stock's strategy state after the close
    - cron: "30 4 * * 6"         # Saturday 10:00 IST: full re-test of every strategy
  workflow_dispatch:
    inputs:
      mode: { description: "full or states", type: choice, options: [full, states], default: full }
permissions:
  contents: write
concurrency: { group: strategies, cancel-in-progress: false }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11", cache: pip, cache-dependency-path: deps.txt }
      - run: pip install -r deps.txt
      - name: Run
        env:
          MODE_IN: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '30 4 * * 6' && 'full' || 'states') }}
        run: |
          case "$MODE_IN" in full|states) MODE="$MODE_IN" ;; *) MODE=states ;; esac   # only known values reach the shell
          python strategies.py --mode $MODE
          if [ "$MODE" = "full" ]; then python strategies.py --mode states; fi
      - name: Save
        if: always()
        run: bash save.sh
