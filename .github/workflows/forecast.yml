name: outlook
# Outlook for the next 1 and 3 months (forecast.py): re-estimated after every close, and whenever the model changes.
on:
  schedule:
    - cron: "40 14 * * 1-5"     # 20:10 IST, after the insights job
  push:
    branches: [main]
    paths: [forecast.py, .github/workflows/forecast.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: outlook, cancel-in-progress: false }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: deps.txt }
      - run: pip install -r deps.txt
      - name: Run
        run: python forecast.py
      - name: Save
        if: always()
        run: bash save.sh
