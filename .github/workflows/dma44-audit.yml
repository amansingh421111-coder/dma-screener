name: dma44-audit
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: dma44, cancel-in-progress: false }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: deps.txt }
      - run: pip install -r deps.txt
      - name: Run
        run: python dma44_audit.py
      - name: Save
        if: always()
        run: bash save.sh
