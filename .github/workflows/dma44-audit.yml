name: dma44-audit
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: dma44, cancel-in-progress: false }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11", cache: pip, cache-dependency-path: deps.txt }
      - run: pip install -r deps.txt
      - name: Run
        run: python dma44_audit.py
      - name: Save
        if: always()
        run: bash save.sh
