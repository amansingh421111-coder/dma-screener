name: approaching-outlook
# History of shares 0-2% below their 44-DMA and today's Approaching list scored on it (approach.py).
# Every weekday evening after the close, and whenever the test changes.
on:
  schedule:
    - cron: "40 13 * * 1-5"     # 19:10 IST
  push:
    branches: [main]
    paths: [approach.py, .github/workflows/approach.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: approach, cancel-in-progress: false }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11", cache: pip, cache-dependency-path: deps.txt }
      - run: pip install -r deps.txt
      - name: Run
        run: python approach.py
      - name: Save
        if: always()
        run: bash save.sh
