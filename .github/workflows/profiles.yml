name: company-profiles
# Company descriptions for the stock pages (profiles.py): weekly, and whenever the script changes.
on:
  schedule:
    - cron: "0 6 * * 0"         # Sunday 11:30 IST
  push:
    branches: [main]
    paths: [profiles.py, .github/workflows/profiles.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: profiles, cancel-in-progress: false }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11", cache: pip, cache-dependency-path: deps.txt }
      - run: pip install -r deps.txt
      - name: Run
        run: python profiles.py
      - name: Save
        if: always()
        run: bash save.sh
