name: candle-patterns
# Test of 20 classic candlestick patterns (candles.py): weekly, and whenever the test changes.
on:
  schedule:
    - cron: "30 9 * * 0"        # Sunday 15:00 IST
  push:
    branches: [main]
    paths: [candles.py, .github/workflows/candles.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: candles, cancel-in-progress: false }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: deps.txt }
      - run: pip install -r deps.txt
      - name: Run
        run: python candles.py
      - name: Save
        if: always()
        run: bash save.sh
