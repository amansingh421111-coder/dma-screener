name: strategies-expanded
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 0"         # Sunday 13:30 IST: re-run the expanded test of every strategy
permissions:
  contents: write
concurrency: { group: sx, cancel-in-progress: false }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: deps.txt }
      - run: pip install -r deps.txt
      - name: Run
        run: python strategies_x.py
      - name: Save
        if: always()
        run: bash save.sh
