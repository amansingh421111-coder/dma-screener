name: insights
on:
  schedule:
    - cron: "15 3 * * 1-5"       # 08:45 IST: world markets overnight, morning headlines
    - cron: "15 14 * * 1-5"      # 19:45 IST: after the close
    - cron: "15 5 * * 6"         # Saturday 10:45 IST: refreshes company financials (weekly)
  workflow_dispatch:
    inputs:
      fund: { description: "also refresh company financials", type: boolean, default: false }
permissions:
  contents: write
concurrency: { group: insights, cancel-in-progress: false }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: deps.txt }
      - run: pip install -r deps.txt
      - name: Run
        run: |
          if [ "${{ github.event.schedule }}" = "15 5 * * 6" ] || [ "${{ inputs.fund }}" = "true" ]; then python insights.py --fund; else python insights.py; fi
      - name: Save
        if: always()
        run: bash save.sh
