name: screener
on:
  schedule:
    - cron: "0 3 * * 1-5"        # 08:30 IST: morning session, exact 15-minute scans until 12:30
    - cron: "45 6 * * 1-5"       # 12:15 IST: afternoon session until 16:30 (waits for the morning one to finish)
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [run, test-alert, backtest, brief-morning, brief-evening]
        default: run
      top: { description: "Backtest: number of stocks", default: "100" }
      years: { description: "Backtest: years of history", default: "5" }
permissions:
  contents: write
concurrency: { group: "${{ github.event_name == 'schedule' && 'sessions' || 'manual' }}", cancel-in-progress: false }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      UPSTASH_URL: ${{ secrets.UPSTASH_URL }}
      UPSTASH_TOKEN: ${{ secrets.UPSTASH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: deps.txt }
      - run: pip install -r deps.txt
      - name: Session (exact 15-minute scans)
        if: github.event_name == 'schedule'
        env: { PYTHONUNBUFFERED: "1" }
        run: python session.py --until ${{ github.event.schedule == '0 3 * * 1-5' && '12:30' || '16:30' }}
      - name: Screener (manual run)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'run'
        run: python screen.py --force
      - name: Test alert
        if: inputs.mode == 'test-alert'
        run: python screen.py --test-alert
      - name: Briefs
        if: startsWith(inputs.mode, 'brief-')
        run: python brief.py ${{ inputs.mode == 'brief-morning' && 'morning' || 'evening' }}
      - name: Backtest
        if: inputs.mode == 'backtest'
        run: python backtest.py --top ${{ inputs.top }} --years ${{ inputs.years }} | tee backtest.txt
      - name: Save results
        if: always()
        run: bash save.sh
