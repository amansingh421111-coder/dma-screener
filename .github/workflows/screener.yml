name: screener
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [run, session, session-am, session-pm, levels, test-alert, backtest, brief-morning, brief-evening]
        default: run
      top: { description: "Backtest: number of stocks", default: "100" }
      years: { description: "Backtest: years of history", default: "5" }
permissions:
  contents: write
concurrency: { group: "${{ github.workflow }}-${{ inputs.mode || 'manual' }}", cancel-in-progress: false }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      UPSTASH_URL: ${{ secrets.UPSTASH_URL }}
      UPSTASH_TOKEN: ${{ secrets.UPSTASH_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11", cache: pip, cache-dependency-path: deps.txt }
      - run: pip install -r deps.txt
      - name: Session (exact 15-minute scans)
        if: startsWith(inputs.mode, 'session')
        env: { PYTHONUNBUFFERED: "1" }
        run: |
          if [ "${{ inputs.mode }}" = "session-am" ]; then
            python session.py --until 12:30
          else
            python session.py --until 16:30
          fi
      - name: End-of-Day Summary Scan (manual run or scheduled EOD)
        if: inputs.mode == 'run'
        run: |
          python screen.py --summary --force
          python brief.py evening || true
      - name: Automatic stop / target only (no alerts)
        if: inputs.mode == 'levels'
        run: python screen.py --levels
      - name: Test alert
        if: inputs.mode == 'test-alert'
        run: python screen.py --test-alert
      - name: Briefs
        if: startsWith(inputs.mode, 'brief-')
        run: python brief.py ${{ inputs.mode == 'brief-morning' && 'morning' || 'evening' }}
      - name: Backtest
        if: inputs.mode == 'backtest'
        run: python backtest.py --top ${{ inputs.top }} --years ${{ inputs.years }} | tee backtest.txt
      - name: Save results
        if: always()
        run: bash save.sh
