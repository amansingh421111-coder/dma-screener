name: dma44-deep
on:
  schedule:
    - cron: "30 5 * * 0"         # Sunday 11:00 IST: deep re-test of the 44-DMA rising rule on NSE and BSE stocks
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: dma44, cancel-in-progress: false }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: deps.txt }
      - run: pip install -r deps.txt
      - name: Run
        run: python dma44_deep.py
      - name: Save
        if: always()
        run: bash save.sh
