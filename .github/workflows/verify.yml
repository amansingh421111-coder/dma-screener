name: verify
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Live site checks
        run: |
          B=https://screenedstocks.vercel.app
          echo "build: $(curl -s $B/ | grep -o 'Build 2026-10-1[0-9]\.[0-9]*')"
          echo "app.css: $(curl -s -o /dev/null -w '%{http_code} %{content_type}' $B/app.css)"
          echo "insights.js has full lists: $(curl -s $B/insights.js | grep -c inLoadFull)"
          curl -s "$B/api/dma?a=feed&fresh=1" > feed.json
          python3 -c "import json;f=json.load(open('feed.json'));print('feed:',f.get('updated'),'pool',f.get('pool'),'stories_total',f.get('stories_total'),'also type',type(f['themes'][0]['stories'][0].get('also',[None])[0]).__name__ if f['themes'][0]['stories'] and f['themes'][0]['stories'][0].get('also') else '-','error',f.get('error'))"
          sleep 5
          for id in people rates all; do curl -s "$B/api/dma?a=theme&id=$id" | python3 -c "import json,sys;j=json.load(sys.stdin);print('theme',j.get('id'),len(j.get('stories',[])),j.get('error',''))"; done
          curl -s "$B/api/dma?a=mkt" | python3 -c "import json,sys;j=json.load(sys.stdin);print('mkt series',len(j.get('series',[])))"
